name: discoveradio

services:
  # Point d'entrée unique : HTTPS automatique en production, proxy vers l'app, le chat et le WebSocket IRC.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app, kiwi, ergo]

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://radio:${POSTGRES_PASSWORD:-radio}@db:5432/radio
      UPLOAD_DIR: /app/uploads
      LIBRARY_DIR: /app/library
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
      BASE_URL: ${BASE_URL:-http://localhost}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-admin@example.com}
      ALLOW_DEV_LOGIN: ${ALLOW_DEV_LOGIN:-0}
      CHAT_ENABLED: ${CHAT_ENABLED:-1}
      FAKE_AUDIENCE: ${FAKE_AUDIENCE:-1}
      AUTO_APPROVE_AFTER: ${AUTO_APPROVE_AFTER:-3}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
    volumes:
      - uploads:/app/uploads
      - ./library:/app/library:ro

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: radio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radio}
      POSTGRES_DB: radio
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radio -d radio"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Chat, 100 % images toutes faites : serveur IRC (Ergo) + client web embarquable (Kiwi IRC).
  ergo:
    image: ghcr.io/ergochat/ergo:stable
    restart: unless-stopped
    volumes:
      - ergo_data:/ircd
      - ./docker/ergo/ircd.yaml:/ircd/ircd.yaml:ro

  kiwi:
    build: ./docker/kiwi
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  ergo_data:
  caddy_data:
  caddy_config: